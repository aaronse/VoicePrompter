name: Deploy to GitHub Pages

# Manual only in this fork. Upstream deploys on every push to main; this fork runs
# locally and has no site to publish, so an automatic deploy would only stand up a
# duplicate of upstream's marketing site under another account. Trigger it by hand
# from the Actions tab if that ever changes.
#
# To restore upstream's behaviour, replace the `on:` block below with:
#   on:
#     push:
#       branches:
#         - main
on:
  workflow_dispatch:

jobs:
  deploy:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Build
        run: npm run build

      - name: Deploy
        uses: peaceiris/actions-gh-pages@v3
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          publish_dir: ./dist
